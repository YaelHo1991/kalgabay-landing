<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalGabay - QR Scanning Desktop Flow</title>
  <link rel="stylesheet" href="../shared-styles.css">
  <style>
    body {
      display: flex;
      min-height: 100vh;
      background: var(--gray-50);
    }

    /* Sidebar - Compact */
    .sidebar {
      width: 80px;
      background: white;
      border-left: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
    }

    .sidebar-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      margin-bottom: 32px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--gray-400);
      font-size: 1.4rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .nav-btn:hover {
      background: var(--gray-100);
      color: var(--gray-600);
    }

    .nav-btn.active {
      background: var(--primary-50);
      color: var(--primary-600);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-right: 80px;
      display: flex;
    }

    /* Scanner Section */
    .scanner-section {
      flex: 1;
      padding: 32px;
      max-width: 600px;
    }

    .section-header {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--gray-500);
    }

    /* Scanner Card */
    .scanner-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
    }

    .scanner-viewport {
      background: linear-gradient(135deg, var(--gray-800), var(--gray-900));
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .scanner-frame {
      width: 200px;
      height: 200px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      position: relative;
    }

    .scanner-frame::before,
    .scanner-frame::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border: 4px solid var(--primary-400);
    }

    .scanner-frame::before {
      top: -4px;
      right: -4px;
      border-left: none;
      border-bottom: none;
      border-top-right-radius: 12px;
    }

    .scanner-frame::after {
      bottom: -4px;
      left: -4px;
      border-right: none;
      border-top: none;
      border-bottom-left-radius: 12px;
    }

    .scanner-line {
      position: absolute;
      top: 30%;
      left: 10%;
      right: 10%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary-400), transparent);
      animation: scan 2s ease-in-out infinite;
    }

    @keyframes scan {
      0%, 100% { top: 20%; }
      50% { top: 70%; }
    }

    .scanner-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .scanner-controls {
      padding: 20px;
      display: flex;
      gap: 12px;
    }

    .scanner-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition-fast);
    }

    .scanner-btn.primary {
      background: var(--primary-500);
      color: white;
      border: none;
    }

    .scanner-btn.secondary {
      background: white;
      color: var(--gray-600);
      border: 1px solid var(--gray-200);
    }

    /* Manual Input */
    .manual-input-card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .input-title {
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      gap: 12px;
    }

    .code-input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      font-size: 1rem;
      font-family: monospace;
    }

    .code-input:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px var(--primary-100);
    }

    .input-btn {
      padding: 14px 24px;
      background: var(--primary-500);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Cart Section */
    .cart-section {
      width: 450px;
      background: white;
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
    }

    .cart-header {
      padding: 24px;
      border-bottom: 1px solid var(--gray-100);
    }

    .cart-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 16px;
    }

    /* Member Card */
    .member-card {
      background: linear-gradient(135deg, var(--primary-50), var(--primary-100));
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .member-avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: white;
      color: var(--primary-600);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .member-info {
      flex: 1;
    }

    .member-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gray-900);
    }

    .member-phone {
      font-size: 0.85rem;
      color: var(--gray-500);
      margin-top: 2px;
    }

    .member-clear {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: white;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
    }

    /* Empty Member State */
    .member-empty {
      background: var(--gray-100);
      border: 2px dashed var(--gray-300);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }

    .member-empty-icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .member-empty-text {
      color: var(--gray-500);
    }

    /* Cart Items */
    .cart-items {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
    }

    .cart-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .cart-item {
      background: var(--gray-50);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .cart-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .cart-item-name {
      font-weight: 600;
      color: var(--gray-900);
    }

    .cart-item-remove {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: var(--danger-100);
      color: var(--danger-500);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .cart-item-price-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .price-label {
      font-size: 0.85rem;
      color: var(--gray-500);
    }

    .price-input {
      width: 120px;
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      direction: ltr;
    }

    .price-input:focus {
      outline: none;
      border-color: var(--primary-500);
    }

    .cart-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--gray-400);
    }

    .cart-empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    /* Cart Footer */
    .cart-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--gray-100);
      background: var(--gray-50);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .total-label {
      font-size: 1rem;
      color: var(--gray-600);
    }

    .total-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-600);
    }

    .cart-actions {
      display: flex;
      gap: 12px;
    }

    .cart-btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .cart-btn.primary {
      background: linear-gradient(135deg, var(--success-500), #059669);
      color: white;
      border: none;
    }

    .cart-btn.secondary {
      background: white;
      color: var(--gray-600);
      border: 1px solid var(--gray-200);
    }

    /* Demo navigation */
    .demo-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gray-900);
      padding: 12px 24px;
      border-radius: 14px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .demo-nav a {
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .demo-nav a:hover {
      opacity: 1;
    }

    .demo-nav span {
      color: var(--gray-500);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">🏛️</div>
    <nav class="sidebar-nav">
      <button class="nav-btn">🏠</button>
      <button class="nav-btn active">📷</button>
      <button class="nav-btn">👥</button>
      <button class="nav-btn">📜</button>
      <button class="nav-btn">📊</button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Scanner Section -->
    <div class="scanner-section">
      <div class="section-header">
        <h1 class="section-title">סריקת QR</h1>
        <p class="section-subtitle">סרוק מעטפה או כרטיס מצווה</p>
      </div>

      <!-- Scanner Card -->
      <div class="scanner-card">
        <div class="scanner-viewport">
          <div class="scanner-frame">
            <div class="scanner-line"></div>
          </div>
          <div class="scanner-hint">מקם את ה-QR במסגרת</div>
        </div>
        <div class="scanner-controls">
          <button class="scanner-btn secondary">
            <span>🔦</span>
            פנס
          </button>
          <button class="scanner-btn secondary">
            <span>🔄</span>
            החלף מצלמה
          </button>
          <button class="scanner-btn primary">
            <span>📷</span>
            צלם
          </button>
        </div>
      </div>

      <!-- Manual Input -->
      <div class="manual-input-card">
        <h3 class="input-title">או הזן קוד ידנית:</h3>
        <div class="input-group">
          <input type="text" class="code-input" placeholder="MBR-001 / MTZ-001">
          <button class="input-btn">הוסף</button>
        </div>
      </div>
    </div>

    <!-- Cart Section -->
    <div class="cart-section">
      <div class="cart-header">
        <h2 class="cart-title">סל הרכישות</h2>

        <!-- Member Card -->
        <div class="member-card">
          <div class="member-avatar">יכ</div>
          <div class="member-info">
            <div class="member-name">יוסי כהן</div>
            <div class="member-phone">050-123-4567</div>
          </div>
          <button class="member-clear">✕</button>
        </div>

        <!-- Or empty state: -->
        <!--
        <div class="member-empty">
          <div class="member-empty-icon">📨</div>
          <div class="member-empty-text">סרוק מעטפה לזיהוי מתפלל</div>
        </div>
        -->
      </div>

      <!-- Cart Items -->
      <div class="cart-items">
        <h4 class="cart-section-title">מצוות בסל (3)</h4>

        <div class="cart-item">
          <div class="cart-item-header">
            <span class="cart-item-name">עליה לתורה - שלישי</span>
            <button class="cart-item-remove">✕</button>
          </div>
          <div class="cart-item-price-row">
            <span class="price-label">מחיר:</span>
            <input type="text" class="price-input" value="₪180">
          </div>
        </div>

        <div class="cart-item">
          <div class="cart-item-header">
            <span class="cart-item-name">פתיחת ההיכל</span>
            <button class="cart-item-remove">✕</button>
          </div>
          <div class="cart-item-price-row">
            <span class="price-label">מחיר:</span>
            <input type="text" class="price-input" value="₪350">
          </div>
        </div>

        <div class="cart-item">
          <div class="cart-item-header">
            <span class="cart-item-name">הגבהה</span>
            <button class="cart-item-remove">✕</button>
          </div>
          <div class="cart-item-price-row">
            <span class="price-label">מחיר:</span>
            <input type="text" class="price-input" value="₪150">
          </div>
        </div>
      </div>

      <!-- Cart Footer -->
      <div class="cart-footer">
        <div class="cart-total">
          <span class="total-label">סה"כ לתשלום:</span>
          <span class="total-value">₪680</span>
        </div>
        <div class="cart-actions">
          <button class="cart-btn secondary">ביטול</button>
          <button class="cart-btn primary">
            <span>💾</span>
            שמור ושלח הודעה
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Demo Navigation -->
  <nav class="demo-nav">
    <span>מחשב - תהליך סריקה</span>
    <a href="index.html">← חזרה</a>
    <a href="android-flow.html">אנדרואיד →</a>
  </nav>
</body>
</html>
