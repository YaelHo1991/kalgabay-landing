[package]
name = "kalgabay"
version = "1.0.0"
description = "KalGabay - QR Card Matcher Application"
authors = ["you"]
edition = "2021"

[lib]
name = "kalgabay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
serde_json = "1"
urlencoding = "2"
base64 = "0.22"

# Android print plugin (local) - always included for permissions, only init on Android
tauri-plugin-android-print = { path = "plugins/tauri-plugin-android-print" }

# Desktop dependencies (with native-tls)
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-printer-v2 = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "hostname", "builder"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Android dependencies (with rustls instead of native-tls - must disable default-features!)
[target.'cfg(target_os = "android")'.dependencies]
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname", "builder"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
