[package]
name = "tauri-plugin-android-print"
version = "0.1.0"
edition = "2021"
description = "A Tauri plugin for Android network printer discovery and printing via IPP"
authors = ["KalGabay"]
links = "tauri-plugin-android-print"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
tauri-plugin = { version = "2", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
